# ==========================================================
#  dkChat - messages
#  {prefix} is replaced with the prefix below in every message.
# ==========================================================

prefix: "<gradient:#5B8CFF:#9F6BFF><bold>dkChat</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>You don't have permission to do that."
players-only: "{prefix}<red>Only players can use this command."
unknown-subcommand: "{prefix}<red>Unknown command. Use <white>/dchat help</white>."

reload-success: "{prefix}<green>Reloaded in <white>{time}ms</white>. Loaded <white>{formats}</white> chat format(s)."
reload-failed: "{prefix}<red>Reload failed. A config file has a YAML error, check the console. The old settings are still active."

your-format: "{prefix}<gray>You are using the <white>{format}</white> chat format <dark_gray>(priority {priority})</dark_gray>."

# Private messages
player-not-found: "{prefix}<red><white>{player}</white> is not online."
msg-usage: "{prefix}<gray>Usage: <white>/msg <player> <message>"
msg-self: "{prefix}<red>You can't message yourself."
msg-empty: "{prefix}<red>Your message is empty."
msg-ignored: "{prefix}<red>You can't send messages to <white>{player}</white>."
msg-muted: "{prefix}<red>You are muted and can't send private messages."
reply-usage: "{prefix}<gray>Usage: <white>/r <message>"
reply-none: "{prefix}<red>You have nobody to reply to."
reply-offline: "{prefix}<red>The player you were talking to is no longer online."

# Spy
spy-enabled: "{prefix}<green>Spy enabled.</green> <gray>You will see private messages."
spy-disabled: "{prefix}<red>Spy disabled.</red> <gray>You won't see private messages."

# Ignore
ignore-usage: "{prefix}<gray>Usage: <white>/ignore <player></white> or <white>/ignore list"
ignore-self: "{prefix}<red>You can't ignore yourself."
ignore-exempt: "{prefix}<red>You can't ignore <white>{player}</white>."
ignore-full: "{prefix}<red>Your ignore list is full ({max} players). Remove someone first."
ignore-added: "{prefix}<gray>You are now ignoring <white>{player}</white>."
ignore-removed: "{prefix}<gray>You are no longer ignoring <white>{player}</white>."
ignore-list: "{prefix}<gray>Ignored players ({count}): <white>{players}"
ignore-list-empty: "{prefix}<gray>You aren't ignoring anyone."

# [item] / [inv] / [echest]
showcase-cooldown: "{prefix}<red>You can use <white>{tag}</white> again in <white>{time}s</white>."
showcase-empty-hand: "{prefix}<red>Hold an item in your hand to use <white>{tag}</white>."
showcase-expired: "{prefix}<red>This preview has expired."
showcase-failed: "{prefix}<red>Couldn't show that right now. Please try again."

# /ad
ad-usage: "{prefix}<gray>Usage: <white>/ad <message>"
ad-status-ready: "{prefix}<green>You can advertise now."
ad-status-cooldown: "{prefix}<gray>You can advertise again in <white>{time}</white>."
ad-disabled: "{prefix}<red>Advertisements are turned off right now."
ad-too-short: "{prefix}<red>Your ad must be at least <white>{min}</white> characters."
ad-too-long: "{prefix}<red>Your ad can't be longer than <white>{max}</white> characters."
ad-cooldown: "{prefix}<red>You can advertise again in <white>{time}</white>."
ad-no-money: "{prefix}<red>You need <white>{cost}</white> to post an ad."
ad-paid: "{prefix}<gray>Your ad was posted. <white>{cost}</white> was taken from your balance."
ad-muted: "{prefix}<red>You are muted and can't post ads."
ad-unavailable: "{prefix}<red>Ads can't be posted right now. Please tell a staff member."

# /clearchat
clearchat-self: "{prefix}<gray>Your chat was cleared."
clearchat-all: "{prefix}<gray>The chat was cleared by <white>{player}</white>."

# /dchat announce
announce-usage: "{prefix}<gray>Usage: <white>/dchat announce <id></white>. Loaded: <white>{list}"
announce-sent: "{prefix}<green>Sent announcement <white>{id}</white>."
announce-unknown: "{prefix}<red>No announcement called <white>{id}</white>. Loaded: <white>{list}"

help:
  - "<gradient:#5B8CFF:#9F6BFF><bold>dkChat</bold></gradient> <gray>v{version} by direk james"
  - "<white>/dchat format</white> <dark_gray>-</dark_gray> <gray>See which chat format you are using"
  - "<white>/msg <player> <message></white> <dark_gray>-</dark_gray> <gray>Send a private message"
  - "<white>/r <message></white> <dark_gray>-</dark_gray> <gray>Reply to your last private message"
  - "<white>/ignore <player></white> <dark_gray>-</dark_gray> <gray>Ignore or unignore a player"
  - "<white>/ad <message></white> <dark_gray>-</dark_gray> <gray>Advertise to the whole server"
  - "<white>/clearchat</white> <dark_gray>-</dark_gray> <gray>Clear your own chat"
  - "<gray>Type <white>[i]</white>, <white>[inv]</white> or <white>[ec]</white> in chat to show your item, inventory or ender chest"

help-admin:
  - "<white>/dchat reload</white> <dark_gray>-</dark_gray> <gray>Reload all config files"
  - "<white>/dchat announce <id></white> <dark_gray>-</dark_gray> <gray>Send an announcement now"
  - "<white>/clearchat all</white> <dark_gray>-</dark_gray> <gray>Clear chat for everyone except staff"
